      - key: LEAD_NOTIFICATION_RETRY_MINUTES
        value: 2
      - key: LEAD_HANDOFF_CHECK_INTERVAL_MS
        value: 60000
      - key: FIELD_SERVICE_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: FIELD_SERVICE_OAUTH_STATE_SECRET
        generateValue: true
      - key: JOBBER_CLIENT_ID
        sync: false
      - key: JOBBER_CLIENT_SECRET
        sync: false
      - key: JOBBER_REDIRECT_URI
        value: https://api.myaipa.ca/api/integrations/jobber/oauth/callback
      - key: JOBBER_GRAPHQL_VERSION
        value: 2025-04-16
      - key: STORE_CALL_TRANSCRIPTS
        value: true
      - key: STORE_CALL_RECORDING_URLS
        value: true
      - key: EXPOSE_CALL_TRANSCRIPTS_IN_ADMIN
        value: true
      - key: EXPOSE_RECORDING_URLS_IN_ADMIN
        value: true
      - key: CALL_TRANSCRIPT_RETENTION_DAYS
        value: 30
      - key: CALL_RECORDING_RETENTION_DAYS
        value: 30
      - key: TWILIO_API_BASE_URL
        value: https://api.twilio.com
      - key: FIXED_MONTHLY_COST_USD
        value: 0
      - key: FIXED_MONTHLY_COSTS_JSON
        sync: false
      - key: MISSED_CALL_ALERT_ENABLED
        value: false
      - key: DAILY_DIGEST_ENABLED
        value: false
