databases:
  - name: myaipa-postgres
    databaseName: myaipa
    user: myaipa
    plan: basic-256mb
    region: ohio

services:
  - type: web
    name: myaipa-api
    runtime: node
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run backend:prepare
    preDeployCommand: npm run db:push
    startCommand: npm run server:prod
    healthCheckPath: /api/health/ready
    disk:
      name: myaipa-data
      mountPath: /data
      sizeGB: 1
    domains:
      - api.myaipa.ca
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_APP_URL
        value: https://api.myaipa.ca
      - key: FRONTEND_APP_URL
        value: https://www.myaipa.ca
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CALENDAR_OAUTH_STATE_SECRET
        generateValue: true
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://api.myaipa.ca/api/calendar/oauth/google/callback
      - key: MICROSOFT_CALENDAR_CLIENT_ID
        sync: false
      - key: MICROSOFT_CALENDAR_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CALENDAR_REDIRECT_URI
        value: https://api.myaipa.ca/api/calendar/oauth/microsoft/callback
      - key: ALLOWED_ORIGINS
        value: https://www.myaipa.ca,https://myaipa.ca
      - key: DATABASE_URL
        fromDatabase:
          name: myaipa-postgres
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: MAKE_SIGNUP_WEBHOOK_URL
        sync: false
      - key: MAKE_SIGNUP_WEBHOOK_API_KEY
        sync: false
      - key: INTEGRATION_API_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TRIAL_DAYS
        value: 14
      - key: STRIPE_SUCCESS_URL
        value: https://www.myaipa.ca/#/signup?payment=success
      - key: STRIPE_CANCEL_URL
        value: https://www.myaipa.ca/#/signup?payment=cancelled
      - key: STRIPE_ALLOW_PROMOTION_CODES
        value: false
      - key: TRIAL_HALFWAY_REMINDER_DAYS
        value: 7
      - key: TRIAL_REMINDER_CHECK_INTERVAL_MS
        value: 3600000
      - key: TRIAL_REMINDER_DISABLE
        value: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_INBOUND_WEBHOOK_URL
        value: https://api.myaipa.ca/api/webhooks/sms
      - key: SMS_SUPPRESSION_CHECK_URL
        value: https://api.myaipa.ca/api/integrations/sms/suppression/check
      - key: SMS_SUPPRESSION_API_KEY
        generateValue: true
      - key: OWNER_SMS_FROM
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SIGNUP_REQUIRE_MANUAL_APPROVAL
        value: false
      - key: SIGNUP_REQUIRE_VERIFICATION
        value: false
      - key: SIGNUP_IP_WINDOW_MS
        value: 900000
      - key: SIGNUP_IP_MAX_REQUESTS
        value: 5
      - key: SIGNUP_IDENTITY_WINDOW_MS
        value: 3600000
      - key: SIGNUP_IDENTITY_MAX_REQUESTS
        value: 2
      - key: SIGNUP_DUPLICATE_WINDOW_MS
        value: 600000
      - key: SIGNUP_MIN_ELAPSED_MS
        value: 2500
      - key: PUBLIC_ROUTE_WINDOW_MS
        value: 900000
      - key: BUSINESS_ENRICH_IP_MAX_REQUESTS
        value: 10
      - key: STRIPE_CHECKOUT_IP_MAX_REQUESTS
        value: 5
      - key: ADMIN_LOGIN_IP_MAX_REQUESTS
        value: 10
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: SIGNUP_REVIEW_DUPLICATES
        value: true
      - key: CUSTOMER_DASHBOARD_IP_WINDOW_MS
        value: 900000
      - key: CUSTOMER_DASHBOARD_IP_MAX_REQUESTS
        value: 30
      - key: CUSTOMER_DASHBOARD_LOOKUP_WINDOW_MS
        value: 3600000
      - key: CUSTOMER_DASHBOARD_LOOKUP_MAX_REQUESTS
        value: 8
      - key: CUSTOMER_DASHBOARD_SESSION_TTL_MS
        value: 43200000
      - key: CUSTOMER_DASHBOARD_CODE_TTL_MS
        value: 600000
      - key: CUSTOMER_DASHBOARD_CODE_MAX_ATTEMPTS
        value: 5
      - key: SIGNUP_VERIFICATION_TTL_MS
        value: 86400000
      - key: SIGNUP_VERIFICATION_BASE_URL
        value: https://api.myaipa.ca
      - key: EMAIL_VERIFICATION_DEV_MODE
        value: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ASSISTANT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: OPENAI_TRANSCRIBE_LANGUAGE
        value: en
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_SUPPORT_TOKEN
        sync: false
      - key: GITHUB_SUPPORT_REPO
        value: OllieinCanada/MyA.I.PA
      - key: GITHUB_SUPPORT_LABELS
        value: ""
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_API_BASE_URL
        value: https://api.vapi.ai
      - key: VAPI_CALL_LIMIT
        value: 100
      - key: VAPI_DEFAULT_BUSINESS_ID
        value: 1
      - key: VAPI_REQUIRE_BUSINESS_MAPPING
        value: true
      - key: VAPI_BUSINESS_MAP
        sync: false
      - key: VAPI_AUTO_SYNC_ENABLED
        value: true
      - key: VAPI_AUTO_SYNC_INTERVAL_MS
        value: 900000
      - key: VAPI_SMS_ASSISTANT_ID
        sync: false
      - key: VAPI_SMS_PHONE_NUMBER_ID
        sync: false
      - key: LEAD_ACK_BASE_URL
        value: https://api.myaipa.ca
      - key: LEAD_ACK_SECRET
        generateValue: true
      - key: LEAD_ACK_TIMEOUT_MINUTES
        value: 2
      - key: LEAD_ACK_TOKEN_TTL_HOURS
