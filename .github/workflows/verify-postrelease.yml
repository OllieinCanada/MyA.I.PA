name: Read post-release verification evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test privacy and read-only boundaries
        run: node --test tests/postrelease-verification.test.js
      - name: Read aggregate evidence without alerts or retries
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: node scripts/verify-postrelease.js
