name: Coordinator read-only operational diagnosis

# This execution-only diagnostic exists only on codex/runtime-readonly-evidence-attempt-1.
# Never merge this branch or replace CodeQL on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-runtime-evidence
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/runtime-readonly-evidence-attempt-1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Test the allowlisted diagnostic offline
        run: node --test tests/coordinator-runtime-evidence.test.js
      - name: Read one protected operational snapshot
        env:
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/coordinator-runtime-evidence.js | tee "$RUNNER_TEMP/coordinator-runtime-evidence.json"
      - name: Show only the allowlisted result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/coordinator-runtime-evidence.json" ]; then
            cat "$RUNNER_TEMP/coordinator-runtime-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          fi
