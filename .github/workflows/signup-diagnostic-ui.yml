name: Signup diagnostic dashboard proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signup-diagnostic-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signup-diagnostic-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DISABLE_LOCAL_ENV_FILES: '1'
      SIGNUP_DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REACT_APP_API_BASE_URL: https://api.myaipa.ca
      REACT_APP_GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
      REACT_APP_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps --ignore-scripts
      - name: Verify saved-evidence, exact target, callback and read-only API contracts
        run: node --test tests/saved-evidence-polling.test.js tests/signup-live-diagnostics.test.js tests/signup-live-diagnostic-routes.test.js tests/signup-purchase-evidence.test.js tests/signup-diagnostic-check.test.js tests/signup-recovery-guidance.test.js tests/signup-verification-preview.test.js tests/signup-observability-ui.test.js tests/admin-signup-setup.test.js tests/signup-control-room.test.js tests/admin-signup-tracker-api.test.js tests/telegram-approval-actions.test.js
      - name: Actual React automatic-progress and connection-recovery regressions
        run: npm test -- --watchAll=false --runInBand --runTestsByPath src/LiveSignupTracker.test.js src/SignupNowOverview.test.js
      - name: Anonymous start, deduplicated alert and metadata admission contracts
        run: npm run test:signup-form-observation
      - name: Install isolated regression browser
        run: npx playwright install --with-deps chromium
      - name: Actual dashboard and routes at desktop and both phone widths
        run: npm run test:signup-tracker:browser
      - name: Redacted assistant, purchase and unlinked-auth error presentation (partial synthetic proof only)
        run: |
          npm run test:signup-tracker:browser -- --assistant-error-proof-only
          npm run test:signup-tracker:browser -- --purchase-error-proof-only
          npm run test:signup-tracker:browser -- --purchase-auth-error-proof-only
      - name: Actual Start Trial click and automatic compact tracker updates
        run: npm run test:signup-form-observation:browser
      - name: Build the publication candidate with the existing public configuration
        run: npm run build:pages
      - name: Archive the tested publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: signup-now-pages-build-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            docs/index.html
            docs/404.html
            docs/asset-manifest.json
            docs/static-asset-history.json
            docs/cookies.html
            docs/proof/index.html
            docs/illustrations/canadian-flag.png
            docs/static/
      - name: Preserve synthetic screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-diagnostic-ui-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            diagnostics/signup-tracker-preview/*.png
            diagnostics/signup-tracker-preview/browser-report.json
            diagnostics/signup-tracker-preview/*-partial-report.json
            diagnostics/signup-form-observation-phase-b/*.png
            diagnostics/signup-form-observation-phase-b/*browser-report.json
            diagnostics/signup-form-observation-phase-b/failure-*.json
