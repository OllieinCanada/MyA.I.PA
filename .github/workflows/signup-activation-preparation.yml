name: Signup activation preparation (no providers or sends)
on:
  pull_request:
permissions:
  contents: read
jobs:
  activation-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DISABLE_LOCAL_ENV_FILES: '1'
      DATABASE_URL: postgresql://ci:synthetic-ci-only@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run test:signup-activation-preparation
      - name: Real disposable PostgreSQL reader and save
        env:
          RUN_ACTIVATION_POSTGRES: '1'
        run: node --test tests/signup-activation-postgres.test.js
