name: Provider-disabled provisioning diagnostic (synthetic PostgreSQL)
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DISABLE_LOCAL_ENV_FILES: '1'
      DATABASE_URL: postgresql://ci:synthetic-ci-only@127.0.0.1:5432/ci
      DIAGNOSTIC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      RUN_PREFLIGHT_DIAGNOSTIC_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run test:provisioning-preflight-diagnostic
      - run: node --test tests/provisioning-preflight-diagnostic-postgres.test.js
      - run: node scripts/verify-provider-disabled-diagnostic-evidence.js diagnostics/provider-disabled-diagnostic/result.json
      - name: Preserve exact-head synthetic results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-disabled-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/provider-disabled-diagnostic/*.json
          if-no-files-found: error
          retention-days: 14
