name: Post-call persistence PostgreSQL drill
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postcall-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postcall-persistence-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postcall_drill
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: myaipa_postcall_drill_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      DISABLE_LOCAL_ENV_FILES: '1'
      RUN_POSTCALL_PERSISTENCE_DRILL: '1'
      DATABASE_URL: postgresql://postcall_drill:synthetic-ci-only@127.0.0.1:5432/myaipa_postcall_drill_ci?connection_limit=4
      POSTCALL_PERSISTENCE_DRILL_DATABASE_URL: postgresql://postcall_drill:synthetic-ci-only@127.0.0.1:5432/myaipa_postcall_drill_ci?connection_limit=4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run backend:prepare
      - run: node --test tests/postcall-drill-safety.test.js
      - run: npx prisma db push --skip-generate
      - name: Test slow saves, concurrent real webhooks, actual expiry and uncertain commits without providers
        run: |
          mkdir -p diagnostics/postcall-persistence
          npm run test:postcall:postgres | tee diagnostics/postcall-persistence/result.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postcall-persistence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/postcall-persistence/result.tap
          if-no-files-found: error
          retention-days: 14
