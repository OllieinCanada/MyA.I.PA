name: Quality and release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      REACT_APP_API_BASE_URL: https://api.myaipa.ca

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend component and responsive regression tests
        run: npm test -- --watchAll=false --runInBand

      - name: Backend security and provider tests
        run: npm run test:backend

      - name: Exercise the real PostgreSQL schema and constraints
        env:
          RUN_DATABASE_INTEGRATION: "1"
        run: |
          npx prisma db push --skip-generate
          npm run test:database

      - name: Validate private legal drafts when present
        run: npm run legal:validate

      - name: Validate operational readiness controls
        run: npm run ops:validate

      - name: Scan tracked files for common secret formats
        run: npm run security:scan-secrets

      - name: Validate deploy configuration
        run: |
          npm run render:validate
          npm run backend:check
          npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build GitHub Pages output
        run: npm run build:pages

      - name: Verify generated Pages output
        run: |
          test -f docs/index.html
          test -f docs/asset-manifest.json
          grep -q 'static/js/main\.' docs/index.html
          grep -q 'static/css/main\.' docs/index.html
