name: Quality and release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      REACT_APP_API_BASE_URL: https://api.myaipa.ca
      REACT_APP_GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend component and responsive regression tests
        run: npm test -- --watchAll=false --runInBand

      - name: Backend security and provider tests
        run: npm run test:backend

      - name: Exercise the real PostgreSQL schema and constraints
        env:
          RUN_DATABASE_INTEGRATION: "1"
        run: |
          npx prisma db push --skip-generate
          npm run test:database

      - name: Exercise isolated signup restart and concurrent-replay recovery
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/myaipa_recovery_drill_ci?connection_limit=2
          SIGNUP_RECOVERY_DRILL_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/myaipa_recovery_drill_ci?connection_limit=2
        run: |
          node -e 'const {Client}=require("pg"); const client=new Client({connectionString:"postgresql://ci:ci@127.0.0.1:5432/ci"}); (async()=>{await client.connect(); try {await client.query("CREATE DATABASE myaipa_recovery_drill_ci");} finally {await client.end();}})().catch(error=>{console.error(error.message);process.exitCode=1;});'
          npx prisma db push --skip-generate
          npm run test:signup-recovery:postgres
          npm run test:signup-setup:postgres

      - name: Save signup recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            diagnostics/signup-failure-recovery-audit/postgres-restart.json
            diagnostics/signup-failure-recovery-audit/verified-setup-chain.json
          if-no-files-found: ignore

      - name: Validate private legal drafts when present
        run: npm run legal:validate

      - name: Validate operational readiness controls
        run: npm run ops:validate

      - name: Scan tracked files for common secret formats
        run: npm run security:scan-secrets

      - name: Validate deploy configuration
        run: |
          npm run render:validate
          npm run backend:check
          npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build GitHub Pages output
        run: npm run build:pages

      - name: Verify generated Pages output
        run: |
          test -f docs/index.html
          test -f docs/asset-manifest.json
          grep -q 'static/js/main\.' docs/index.html
          grep -q 'static/css/main\.' docs/index.html

      - name: Install browser for offline signup regression
        run: npx playwright install --with-deps chromium

      - name: Verify single-review signup on mobile and desktop
        env:
          PRICING_QA_BUILD_DIR: docs
        run: |
          npm run test:signup-pricing-choices
          npm run test:signup-footer-layout
          npm run test:homepage-mobile-hero
          npm run test:forwarding:browser
          npm run preview:signup-verification-progress

      - name: Save signup browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-browser-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            diagnostics/pricing-choices/
            diagnostics/verification-progress/
            diagnostics/signup-footer/
            diagnostics/homepage-hero/
            diagnostics/forwarding-onboarding/
          if-no-files-found: ignore

      - name: Archive verified Pages output
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 3
          path: |
            docs/index.html
            docs/404.html
            docs/asset-manifest.json
            docs/proof/index.html
            docs/illustrations/canadian-flag.png
            docs/static/
