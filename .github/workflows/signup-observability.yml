name: Signup observability SQL proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  observability-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      DISABLE_LOCAL_ENV_FILES: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npx prisma db push --skip-generate
      - name: Synthetic core and actual authenticated loopback handlers
        run: |
          mkdir -p diagnostics/signup-observability-ci
          npm run test:provider-maintenance | tee diagnostics/signup-observability-ci/maintenance.txt
          npm run test:signup-bugs | tee diagnostics/signup-observability-ci/bugs.txt
          node --test tests/signup-assistant-error.test.js tests/signup-purchase-error.test.js tests/signup-assistant-failure-evidence.test.js tests/signup-purchase-error-route.test.js | tee diagnostics/signup-observability-ci/provisioning-errors.txt
      - name: Real isolated SQL concurrency and uncertainty (no providers)
        env:
          RUN_OBSERVABILITY_POSTGRES: '1'
        run: node --test --test-reporter=tap tests/signup-observability-postgres.test.js tests/reconciled-tracker-postgres.test.js tests/signup-mapping-timeout-postgres.test.js | tee diagnostics/signup-observability-ci/postgres.txt
      - name: Guarded Telegram configuration SQL safety (mocked transport only)
        env:
          RUN_TELEGRAM_WEBHOOK_POSTGRES: '1'
        run: npm run test:telegram-webhook:postgres | tee diagnostics/signup-observability-ci/webhook-postgres.txt
      - name: Record exact-head source provenance
        if: always()
        run: |
          mkdir -p diagnostics/signup-observability-ci
          git rev-parse HEAD > diagnostics/signup-observability-ci/head.txt
          sha256sum server/telegramBotApi.js server/telegramWebhookState.js server/index.js tests/telegram-bot-api.test.js tests/telegram-webhook-readback.test.js tests/telegram-webhook-postgres.test.js tests/helpers/telegram-webhook-fixture.js tests/fixtures/telegram-bot-api-e032da4.cjs package.json .github/workflows/signup-observability.yml > diagnostics/signup-observability-ci/webhook-source-hashes.txt
          sha256sum server/signupBindingTransaction.js server/signupBusinessRegistry.js server/signupSavedDiagnosis.js server/signupAlerts.js server/incidentAlerts.js tests/signup-binding-transaction.test.js tests/signup-business-safety.test.js tests/signup-saved-diagnosis.test.js tests/signup-mapping-timeout-postgres.test.js package.json > diagnostics/signup-observability-ci/mapping-source-hashes.txt
          sha256sum server/providerMaintenance.js server/signupBugHistory.js server/signupDiagnosticError.js server/signupAssistantError.js server/signupProvisioningError.js server/index.js server/adminSignupSetup.js server/adminSignupTracker.js server/reconciledTrackerEvidence.js src/SignupBugHistory.js src/signupControlRoomModel.js scripts/preview-admin-signup-tracker.js tests/reconciled-tracker-postgres.test.js tests/signup-observability-postgres.test.js tests/signup-observability-ui.test.js tests/signup-assistant-error.test.js tests/signup-purchase-error.test.js tests/signup-assistant-failure-evidence.test.js tests/signup-purchase-error-route.test.js tests/helpers/provisioning-error-route-fixture.js tests/signup-assistant-recovery.test.js .github/workflows/signup-observability.yml > diagnostics/signup-observability-ci/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signup-observability-${{ github.event.pull_request.head.sha || github.sha }}
          path: diagnostics/signup-observability-ci/
          if-no-files-found: error
          retention-days: 7
