name: Synthetic supervised pilot safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pilot-safety-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pilot_fixture
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: myaipa_pilot_control_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps --ignore-scripts
      - name: Generate client for unchanged schema in disposable service
        env:
          DATABASE_URL: postgresql://pilot_fixture:synthetic-ci-only@127.0.0.1:5432/myaipa_pilot_control_ci
        run: npm run backend:prepare
      - name: Require evidence contracts and routing edge cases
        run: |
          node --test tests/pilot-safety-sql-contract.test.js
          node scripts/run-supervised-pilot-local.js
      - name: Real SQL and independent HTTP application process proof
        env:
          RUN_PILOT_SAFETY_SQL: '1'
          PILOT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/run-pilot-safety-sql.js
      - name: Verify exact-head bounded evidence
        env:
          PILOT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/run-pilot-safety-sql.js --verify
      - name: Expected abort must retain owned-resource cleanup
        env:
          RUN_PILOT_SAFETY_SQL: '1'
          PILOT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PILOT_SQL_EXPECTED_ABORT: '1'
        run: |
          if node scripts/run-pilot-safety-sql.js; then
            echo 'Expected synthetic abort did not occur'
            exit 1
          fi
          node scripts/run-pilot-safety-sql.js --verify --aborted
      - name: Preserve summary only, no raw records or worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-safety-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostics/pilot-safety-sql/result.json
            diagnostics/pilot-safety-sql/expected-abort.json
          if-no-files-found: error
          retention-days: 14
