name: Trial answering PostgreSQL drill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-reservation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trial-reservation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trial_drill
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: myaipa_trial_reservation_drill_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DISABLE_LOCAL_ENV_FILES: "1"
      RUN_TRIAL_RESERVATION_DRILL: "1"
      TRIAL_RESERVATION_DRILL_DATABASE_URL: postgresql://trial_drill:synthetic-ci-only@127.0.0.1:5432/myaipa_trial_reservation_drill_ci?connection_limit=4
      DATABASE_URL: postgresql://trial_drill:synthetic-ci-only@127.0.0.1:5432/myaipa_trial_reservation_drill_ci?connection_limit=4
      TRIAL_RESERVATION_DRILL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Install committed dependencies
        run: npm ci --include=dev --legacy-peer-deps
      - name: Generate existing Prisma client
        run: npm run backend:prepare
      - name: Verify isolation boundaries
        run: node --test tests/trial-reservation-drill-safety.test.js
      - name: Test delayed database responses and simultaneous synthetic webhook requests
        run: npm run test:trial-reservation:postgres
      - name: Preserve exact-head no-send evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-reservation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: diagnostics/trial-reservation-drill/**/report.json
